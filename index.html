<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Stream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-family:system-ui}
#controls{padding:12px;display:flex;gap:10px;justify-content:center;background:#111}
button{padding:12px 24px;font-size:16px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
#start{background:#22c55e;color:#fff}
#stop{background:#ef4444;color:#fff;display:none}
#fs{background:#3b82f6;color:#fff;display:none}
video{flex:1;width:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<div id="controls">
<button id="start">Start Screen Streaming</button>
<button id="stop">Stop</button>
<button id="fs">Fullscreen</button>
</div>
<video id="v" autoplay playsinline muted></video>
<script>
const v=document.getElementById('v'),s=document.getElementById('start'),e=document.getElementById('stop'),f=document.getElementById('fs');
let stream;
s.onclick=async()=>{
 try{
  stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:"monitor"},audio:true});
  v.srcObject=stream;
  s.style.display='none';e.style.display='inline-block';f.style.display='inline-block';
  stream.getVideoTracks()[0].onended=()=>stopStream();
 }catch(err){alert('Error: '+err.message)}
};
function stopStream(){
 if(stream){stream.getTracks().forEach(t=>t.stop());}
 v.srcObject=null;s.style.display='inline-block';e.style.display='none';f.style.display='none';
}
e.onclick=stopStream;
f.onclick=()=>{if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();};
</script>
</body>
</html>
