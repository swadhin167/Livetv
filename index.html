<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DTV Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#06020f;overflow:hidden}
#playerBox{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:100%;
  max-width:100vw;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
}
#playerBox iframe{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  border:0;
  background:#000;
}
/* Right side @dtv_hindi logo hide - bilkul tumhari photo jaisa */
#logoMask{
  position:absolute;
  top:2%;
  right:0.5%;
  width:19.5%;
  height:31%;
  background:#000;
  z-index:10;
  pointer-events:none;
}
#loader{
  position:absolute;inset:0;
  background:#06020f;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;
  z-index:20;
  color:#8a7cc5;font-size:13px;
}
.dot{width:28px;height:28px;border:3px solid #1e1440;border-top-color:#6d5cff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="playerBox">
  <div id="loader"><div class="dot"></div><div>Loading stream...</div></div>
  <div id="logoMask"></div>
  <!-- iframe yaha JS se load hoga -->
</div>

<script>
const PLAYER_URL = "https://i.mdtv.dpdns.org/player?id=3QwMmTkvz27QClsCsIM0&server=1";

async function load(){
  const proxies = [
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.name/fetch/${u}`
  ];
  let html = "";
  for(let fn of proxies){
    try{
      let r = await fetch(fn(PLAYER_URL), {cache:'no-store'});
      if(!r.ok) continue;
      let t = await r.text();
      if(t.length > 800){ html = t; break; }
    }catch(e){}
  }
  if(!html){
    document.getElementById('loader').innerHTML = "<div style='color:#ff6b6b'>Stream load nahi hua</div><div style='font-size:11px;color:#666'>Reload karo</div>";
    return;
  }
  // base tag taaki relative link tootey nahi
  if(!html.toLowerCase().includes('<base')) html = html.replace(/<head[^>]*>/i, `$&<base href="https://i.mdtv.dpdns.org/">`);

  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const ifr = document.createElement('iframe');
  ifr.src = url;
  ifr.setAttribute('allowfullscreen','');
  ifr.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture');
  ifr.onload = ()=>{ document.getElementById('loader').style.display='none'; };
  document.getElementById('playerBox').appendChild(ifr);
}
load();

// Mobile rotate par center me rahe
window.addEventListener('resize', ()=>{
  document.getElementById('playerBox').style.height = "";
});
</script>

</html>
