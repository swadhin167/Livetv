<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Live Crop Player - Single File</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,Arial;min-height:100vh;display:flex;flex-direction:column}
.header{padding:12px;background:#111;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #222}
.header input[type=text]{flex:1;min-width:200px;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}
.header button{padding:10px 16px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:600;cursor:pointer}
.controls{padding:10px;background:#0f0f0f;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid #222}
.ctrl label{font-size:11px;color:#999;display:block;margin-bottom:4px}
.ctrl input{width:100%}
.player-wrap{flex:1;position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:60vh}
.player-wrap iframe{width:100%;height:100%;border:0;aspect-ratio:16/9;max-height:85vh}
.crop{position:absolute;background:#000;z-index:5;pointer-events:none}
#crop-top{top:0;left:0;width:100%}
#crop-bottom{bottom:0;left:0;width:100%}
#crop-left{top:0;left:0;height:100%}
#crop-right{top:0;right:0;height:100%}
#crop-custom{top:0;right:0;background:#000}
.hint{padding:8px 12px;font-size:11px;color:#666;text-align:center;background:#0a0a0a}
</style>
</head>
<body>
<div class="header">
<input id="urlInput" type="text" placeholder="Paste player URL here, ex: https://i.mdtv.dpdns.org/player?id=...">
<button onclick="loadUrl()">Load</button>
<button onclick="toggleFullscreen()" style="background:#222;color:#fff;">Fullscreen</button>
</div>

<div class="controls">
<div class="ctrl"><label>Top Crop: <span id="vTop">0</span>%</label><input type="range" id="topRange" min="0" max="40" value="0" oninput="applyCrop()"></div>
<div class="ctrl"><label>Bottom Crop: <span id="vBottom">0</span>%</label><input type="range" id="bottomRange" min="0" max="40" value="0" oninput="applyCrop()"></div>
<div class="ctrl"><label>Left Crop: <span id="vLeft">0</span>%</label><input type="range" id="leftRange" min="0" max="40" value="0" oninput="applyCrop()"></div>
<div class="ctrl"><label>Right Crop: <span id="vRight">0</span>%</label><input type="range" id="rightRange" min="0" max="40" value="20" oninput="applyCrop()"></div>
</div>

<div class="player-wrap" id="wrap">
<iframe id="player" src="https://i.mdtv.dpdns.org/player?id=3QwMmTkvz27QClsCsIM0&server=1" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
<div id="crop-top" class="crop"></div>
<div id="crop-bottom" class="crop"></div>
<div id="crop-left" class="crop"></div>
<div id="crop-right" class="crop"></div>
</div>

<div class="hint">Single file player • Adjust sliders to crop unwanted borders • Use only for content you have rights to display • Do not remove copyright watermarks/logos</div>

<script>
const player = document.getElementById('player');
const urlInput = document.getElementById('urlInput');
urlInput.value = player.src;

function loadUrl(){
 let u = urlInput.value.trim();
 if(!u) return;
 if(!u.startsWith('http')){ alert('Valid https URL daalo'); return; }
 player.src = u;
}

function applyCrop(){
 const top = document.getElementById('topRange').value;
 const bottom = document.getElementById('bottomRange').value;
 const left = document.getElementById('leftRange').value;
 const right = document.getElementById('rightRange').value;
 document.getElementById('vTop').textContent = top;
 document.getElementById('vBottom').textContent = bottom;
 document.getElementById('vLeft').textContent = left;
 document.getElementById('vRight').textContent = right;
 document.getElementById('crop-top').style.height = top+'%';
 document.getElementById('crop-bottom').style.height = bottom+'%';
 document.getElementById('crop-left').style.width = left+'%';
 document.getElementById('crop-right').style.width = right+'%';
}
function toggleFullscreen(){
 const wrap = document.getElementById('wrap');
 if(document.fullscreenElement){ document.exitFullscreen(); } else { wrap.requestFullscreen(); }
}
applyCrop();
</script>
</body>
</html>
