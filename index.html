<html lang="hi">
<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}

  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;

}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTV Clean - Mobile Host</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08051a;color:#fff;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column}
.header{text-align:center;padding:12px;font-size:12px;color:#7a7590;letter-spacing:1px;background:#120e28;border-bottom:1px solid #221c40}
.stage{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;width:100%;max-width:1000px;margin:0 auto;aspect-ratio:16/9}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.mask{position:absolute;top:8px;right:8px;width:19.5%;height:29%;background:#000;z-index:20;pointer-events:none;border-radius:6px}
.loading{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;color:#a99bd6;font-size:13px;gap:12px}
.spinner{width:32px;height:32px;border:3px solid #2a2250;border-top-color:#6d5cff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:8px;font-size:10px;color:#4a4565}
</style>
</head>
<body>
<div class="header">DTV LIVE • CLEAN • MOBILE HOST • LOGO HIDDEN</div>

<div class="stage" id="stage">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Player load ho raha hai...</div>
    <div style="font-size:10px;color:#5a5570">Mobile data on rakho, 5 sec lagega</div>
  </div>
  <!-- iframe yaha JS se aayega -->
  <div class="mask"></div>
</div>

<div class="footer">Right side @dtv_hindi hidden with black box • Public link: dhin167.github.io</div>

<script>
const PLAYER = "https://i.mdtv.dpdns.org/player?id=3QwMmTkvz27QClsCsIM0&server=1";

async function loadPlayer(){
  const proxies = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://thingproxy.freeboard.name/fetch/${url}`
  ];
  
  let html = "";
  for(let makeUrl of proxies){
    try{
      let proxyUrl = makeUrl(PLAYER);
      document.getElementById('loading').innerHTML = `<div class="spinner"></div><div>Proxy try kar raha hu...</div><div style="font-size:9px;color:#555">${proxyUrl.substring(0,60)}...</div>`;
      let res = await fetch(proxyUrl);
      if(!res.ok) continue;
      html = await res.text();
      if(html.length > 500 && html.includes("<")) break;
    }catch(e){}
  }

  if(!html){
    document.getElementById('loading').innerHTML = `<div style="color:#ff6b6b">❌ Proxy fail ho gaya</div><div style="font-size:11px;color:#8a81a8;margin-top:8px">1. Phone ka data off/on karo<br>2. Page reload karo</div><button onclick="location.reload()" style="margin-top:12px;background:#6d5cff;color:#fff;border:0;padding:8px 16px;border-radius:20px">Retry</button>`;
    return;
  }

  // Relative URL ko absolute banao
  html = html.replace(/<head>/i, `<head><base href="https://i.mdtv.dpdns.org/">`);
  
  // Blob banao - isse X-Frame-Options bypass hota hai
  const blob = new Blob([html], {type: 'text/html'});
  const blobUrl = URL.createObjectURL(blob);
  
  const iframe = document.createElement('iframe');
  iframe.src = blobUrl;
  iframe.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
  iframe.allowFullscreen = true;
  iframe.onload = ()=>{
    document.getElementById('loading').style.display='none';
  };
  
  document.getElementById('stage').appendChild(iframe);
}

loadPlayer();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu
